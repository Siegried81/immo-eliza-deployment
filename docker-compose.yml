# Local stack: API on http://localhost:8000, UI on http://localhost:8502.
# Host port 8502, not 8501: other local Streamlit stacks already publish 8501.
# No source volumes: mounting ./api over /app hid src/, monitoring/ and models/.
services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: immo-api
    ports:
      - "8000:8000"
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: streamlit/Dockerfile
    container_name: immo-ui
    ports:
      - "8502:10000"
    environment:
      # Service name on the compose network; localhost would be the UI container itself.
      - API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped
