# Local stack: API on http://localhost:8008, UI on http://localhost:8508.
# Host ports follow one rule across the local stacks: project N publishes its UI
# on 850N and its API on 800N. This is project 8, so 8508 and 8008, and every
# stack can run side by side.
# No source volumes: mounting ./api over /app hid src/, monitoring/ and models/.
services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    # build + image: `docker compose up --build` builds from source and tags it with the
    # Docker Hub name; `docker compose pull` downloads the published image instead.
    image: ${DOCKERHUB_USERNAME:-siegried}/immo-eliza-api:latest
    container_name: immo-api
    ports:
      - "8008:8000"
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: streamlit/Dockerfile
    image: ${DOCKERHUB_USERNAME:-siegried}/immo-eliza-ui:latest
    container_name: immo-ui
    ports:
      - "8508:10000"
    environment:
      # Service name on the compose network; localhost would be the UI container itself.
      - API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped
