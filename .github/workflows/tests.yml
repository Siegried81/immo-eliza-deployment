# Lints and runs the offline test suite on every push and pull request.
# Python 3.12 like the Dockerfiles: the pinned scikit-learn and numpy ship no
# wheels for older versions. The tests need only the committed models/, not data/.
name: tests

# Pushes to main only: a pull request branch is already checked by pull_request.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same ref makes the running check obsolete.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest
