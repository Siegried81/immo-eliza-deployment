# Runs the offline test suite on every push and pull request.
# Python 3.12 like the Dockerfiles: the pinned scikit-learn and numpy ship no
# wheels for older versions. The tests need only the committed models/, not data/.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: -r requirements.txt pytest httpx
      - name: Test
        run: python -m pytest -q
